name: Update Schedule

on:
  push:
    paths:
      - 'tren-urquiza-horarios.xlsx'  # only runs when xlsx changes

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run update script
        run: python update_schedule.py --xlsx tren-urquiza-horarios.xlsx --html index.html

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update schedule from xlsx"
          git push
