# Deploys worker.js to Cloudflare, on the site's own domain under /api/.
#   npx wrangler login     (once per computer)
#   npx wrangler deploy    (from this folder, after changing worker.js)
name = "tren-urquiza-reports"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "trenurquizahorarios.ar/api/*", zone_name = "trenurquizahorarios.ar" }]

[[kv_namespaces]]
binding = "REPORTS"
id = "6973323ec8c74f47ae70c6b3a623eb3d"

[vars]
ENABLED = "true" # "false" turns reports off for everyone without touching the page
